<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Harmonia Guitars</title>
  <!--stylesheet-->
  <link rel="stylesheet" href="../styles/songLibrary.css">
  <!--google fonts-->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Jua&display=swap"
    rel="stylesheet">
</head>

<body>
  <!--main header-->
  <header id="main-head">
    <div id="head-right">
      <img src="../images/Logo-mark.svg">
      <div id="website-name">
        <h1 class="uppercase letter-spacing-two">Harmonia</h1>
        <h2 class="uppercase letter-spacing-two">Guitars</h2>
      </div>
    </div>
    <nav id="main-navigation">
      <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#" class="selected-page">Song Library</a></li>
        <li><a href="#">Technique Library</a></li>
        <li><a href="#">Schedule Library</a></li>
        <li><a href="#">New Schedule</a></li>
      </ul>
    </nav>
  </header>

  <section id="search-bar-section">
    <img id="menu-img" src="../images/hamburger-menu.png">
    <div id="search-bar-div">
      <img src="../images/eyeglass.png">
      <input type="search" id="search-bar-input" placeholder="Search by song name">
      <button id="search-bar-button" class="uppercase">Search <img src="../images/arrow-right-indigo-deep.png">
      </button>
    </div>
  </section>

  <section class="song-section">
    <p class="song-section-header-p"><span class="song-section-title-span uppercase">top songs</span>
      <span class="song-section-expand-list-span">Expand List</span>
    </p>
    <div class="song-card-grid-div">
      <div class="song-card-div">
        <img src="../images/song-library-imgs/leper-img.png" class="song-card-img">
        <p class="genre-p uppercase">metal</p>
        <div class="song-card-title-div">
          <p class="song-title-p">The Leper Affinity- Opeth</p>
          <div class="rating-div">
            <p><span class="user-rating-span">10</span>/10</p>
            <p class="uppercase">rating</p>
          </div>
        </div>
        <p class="technique-title-p uppercase">techniques</p>
        <div class="technique-list-div">
            <p>Sweep picking</p>
            <p>Syncopation</p>
        </div>
        <p class="song-link-p"> <img src="../images/play.png"> <a href="#">Listen on YouTube</a></p>
      </div>
    </div>
  </section>

</body>

</html>
